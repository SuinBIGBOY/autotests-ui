name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        env:
          APP_URL: ${{ vars.APP_URL }}
          HEADLESS: ${{ vars.HEADLESS }}
          BROWSERS: ${{ vars.BROWSERS }}
          TEST_USER.EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER.USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER.PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_DATA.IMAGE_PNG_FILE: ${{ vars.TEST_DATA_IMAGE_PNG_FILE }}
        run: |
          pytest -m regression --alluredir=./allure-results --numprocesses=3

      - name: Get Allure history
        uses: actions/checkout@v7.0.1
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report action from marketplace
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 10

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history